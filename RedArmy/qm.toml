# ============================== PRIMARY AT RIFLES ==============================
# In the vanilla game an AT rifle is an extra item: it has 10 shots (atRifleShot), never
# reloads, and the soldier goes back to his own gun when it is empty.
# A PRIMARY AT rifle is a soldier's main weapon: it uses weapon.ammo and reloads like any gun.
# It is marked with   weapon.primaryAT = true   (set in hooks.lua, by weapon tag).
# Item AT rifles (the Boys and PzB 39 pickups) are untouched.
# The five patches below go into both firing functions: includes/urb_engine.lua (shooting
# at soldiers) and includes/ai.lua (shooting at vehicles).

# 1. May he fire? A primary AT rifle needs ammo in the weapon, not atRifleShot.
[[patches]]
[patches.regex]
id = "rkka:primary_at_can_fire"
name = "Primary AT rifle: fires on its own ammo"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = '\(\(player\.deployedTroops\[idz\]\.weapon\.ammo > 0 and player\.deployedTroops\[idz\]\.weapon\.class ~= "atRifle"\) or \(player\.deployedTroops\[idz\]\.weapon\.class == "atRifle" and player\.deployedTroops\[idz\]\.atRifleShot > 0\)\)'
position = "at"
payload = '((player.deployedTroops[idz].weapon.ammo > 0 and (player.deployedTroops[idz].weapon.class ~= "atRifle" or player.deployedTroops[idz].weapon.primaryAT)) or (player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT and player.deployedTroops[idz].atRifleShot > 0))'
times = 1

# 2. After a shot: a primary AT rifle loses one round from the weapon, like any other gun.
[[patches]]
[patches.pattern]
id = "rkka:primary_at_uses_ammo"
name = "Primary AT rifle: a shot costs weapon ammo"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = """
if(player.deployedTroops[idz].weapon.class == "atRifle") then
player.deployedTroops[idz].atRifleShot = player.deployedTroops[idz].atRifleShot - 1
"""
position = "at"
apply_as = "edits"
match_indent = true
times = 1
payload = """
if(player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT) then
  player.deployedTroops[idz].atRifleShot = player.deployedTroops[idz].atRifleShot - 1
"""

# 3. Out of ammo: a primary AT rifle reloads instead of being thrown away.
[[patches]]
[patches.pattern]
id = "rkka:primary_at_reloads"
name = "Primary AT rifle: reloads when empty"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = """
if(player.deployedTroops[idz].weapon.class == "atRifle") then
if(player.deployedTroops[idz].atRifleShot <= 0) then
"""
position = "at"
apply_as = "edits"
match_indent = true
times = 1
payload = """
if(player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT) then
  if(player.deployedTroops[idz].atRifleShot <= 0) then
"""

# 4. The "N shots left" text is for item AT rifles only.
[[patches]]
[patches.regex]
id = "rkka:primary_at_no_shots_left_text"
name = "Primary AT rifle: no 'shots left' text"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = 'floatyText\(player\.deployedTroops\[idz\], player\.deployedTroops\[idz\]\.atRifleShot\.\." shots left"\)'
position = "at"
payload = 'if(not player.deployedTroops[idz].weapon.primaryAT) then floatyText(player.deployedTroops[idz], player.deployedTroops[idz].atRifleShot.." shots left") end'
times = 1

# 5. The game gives the Boys two effects by its tag: it smashes light cover, and its hits
#    on vehicles burst. Primary AT rifles get both too.
[[patches]]
[patches.regex]
id = "rkka:primary_at_boys_effects"
name = "Primary AT rifle: Boys hit effects"
target = "includes/urb_engine.lua"
pattern = 'shooter\.weapon\.tag == "boysRifle"'
position = "at"
payload = '(shooter.weapon.tag == "boysRifle" or shooter.weapon.primaryAT)'
times = 2


# ============================== SUPPRESSED WEAPONS ==============================
# In the vanilla game only the Sten MkVI (by its tag) can fire without breaking the stealth
# or camo buff. Each shot rolls: 5% per enemy who can see the shooter to be revealed.
# A weapon marked with   weapon.suppressed = true   (set in hooks.lua, by weapon tag)
# gets the same roll. based_on = "stenMKVI" alone does not do it.
[[patches]]
[patches.regex]
id = "rkka:suppressed_keeps_stealth"
name = "Suppressed weapons: firing can keep stealth"
target = "includes/urb_engine.lua"
pattern = 'player\.deployedTroops\[idz\]\.weapon\.tag ~= "stenMKVI" or stenStealth'
position = "at"
payload = '(player.deployedTroops[idz].weapon.tag ~= "stenMKVI" and not player.deployedTroops[idz].weapon.suppressed) or stenStealth'
times = 1


# ============================== BAYONET THRUST ==============================
# In the vanilla game every melee attack is a rifle-butt swing. With these patches a soldier
# holding one of the weapons listed below does a straight bayonet thrust instead.
# Every other weapon keeps the normal swing. This is looks only: it does not change damage.
#
# HOW TO USE IT: edit the list in patch 1 below. Nothing else needs touching.
#
# WHICH SPRITE, "top" OR "side"?
#   "top"   the weapon's top_<tag>.png, the one you see while he aims. It already points
#           straight ahead, so it is drawn exactly as when aiming, only slid back and forth.
#           Pick this unless you have a reason not to. The bayonet must be visible in the
#           top sprite, or the thrust shows a plain rifle.
#   "side"  the weapon's side_<tag>.png, the menu picture (muzzle to the left). It is turned
#           to point ahead. Bigger and more detailed, but it shows the gun from the side.
#
# SOLDIER ART (optional): the thrust has four steps. If these images exist, a thrusting
# soldier uses them; if not, he uses the normal attack frames. Add them in faction.toml
# under [sprites], one set per unit (allied, sarge, para, french):
#   allied_thrust1 = "units/thrust/allied_thrust1.png"   # wind-up
#   allied_thrust2 = "units/thrust/allied_thrust2.png"   # the stab
#   allied_thrust3 = "units/thrust/allied_thrust3.png"   # the stab, held
#   allied_thrust4 = "units/thrust/allied_thrust4.png"   # pulling back
# Same size as the other soldier frames (100x100).

# 1. The list and the settings.
[[patches]]
[patches.pattern]
id = "rkka:bayonet_setup"
name = "Bayonet thrust: weapon list and settings"
target = "includes/drawFiles.lua"
pattern = 'function drawState0()'
position = "before"
times = 1
payload = """
-- Weapons that thrust: weapon tag = "top" or "side" (which sprite to draw, see above).
rkkaBayonet = {
  mosin44 = "top",
  -- mosin = "top",
}
-- How far the weapon slides, in pixels. Bigger = further.
rkkaThrustBack = 8        -- pulled back for the wind-up and the recovery
rkkaThrustReach = 16      -- pushed forward for the stab

rkkaThrustStep = { attack1 = 1, attack2 = 2, attack3 = 3, attack4 = 4 }

-- Which sprite kind a soldier thrusts with right now, or nil when he is not thrusting.
function rkkaThrusting(soldier)
  if(rkkaThrustStep[soldier.state] == nil or soldier.weapon == nil) then
    return nil
  end
  return rkkaBayonet[soldier.weapon.tag]
end

-- The soldier image: a thrust frame when there is one, else the normal frame.
function rkkaFrame(soldier)
  if(rkkaThrusting(soldier) ~= nil) then
    local img = _G[soldier.tag.."_thrust"..rkkaThrustStep[soldier.state]]
    if(img ~= nil) then
      return img
    end
  end
  -- (spaced differently from the game on purpose, so patch 4 leaves this line alone)
  return _G[soldier.tag .. "_" .. soldier.state]
end

-- The weapon image for the melee states: top sprite for a "top" thrust, else the side sprite.
function rkkaMeleeGun(soldier)
  if(rkkaThrusting(soldier) == "top" and _G["top_"..soldier.weapon.tag] ~= nil) then
    return _G["top_"..soldier.weapon.tag]
  end
  -- (spaced differently from the game on purpose, so patch 3 leaves this line alone)
  return _G["side_" .. soldier.weapon.tag]
end

"""

# 2. Where the weapon sits: straight ahead, slid back or forward.
[[patches]]
[patches.pattern]
id = "rkka:bayonet_pose"
name = "Bayonet thrust: weapon position"
target = "includes/drawFiles.lua"
pattern = 'if(soldier.faction == "axis" and soldier.flagged < 2.5) then'
position = "before"
match_indent = true
times = 1
payload = """
if(rkkaThrusting(soldier) ~= nil) then
  -- forward is minus, back is plus
  local rkkaSlide = -rkkaThrustReach
  if(soldier.state == "attack1" or soldier.state == "attack4") then
    rkkaSlide = rkkaThrustBack
  end
  if(rkkaThrusting(soldier) == "top") then
    -- same as aiming: no turn, full size
    angleAdjust = 0
    xScaleAdjust = 1
    yScaleAdjust = 1
    xAdjust = 0
    yAdjust = rkkaSlide
  else
    -- side sprite: turned so the muzzle points ahead, at the usual melee size
    angleAdjust = math.rad(-90)
    xScaleAdjust = 0.7
    yScaleAdjust = 0.8
    xAdjust = -rkkaSlide
    yAdjust = 0
  end
end
"""

# 3. Which weapon image is drawn in the melee states.
[[patches]]
[patches.regex]
id = "rkka:bayonet_gun_image"
name = "Bayonet thrust: weapon image"
target = "includes/drawFiles.lua"
pattern = '_G\["side_"\.\.soldier\.weapon\.tag\]'
position = "at"
payload = 'rkkaMeleeGun(soldier)'
times = 3

# 4. Which soldier image is drawn.
[[patches]]
[patches.regex]
id = "rkka:bayonet_soldier_image"
name = "Bayonet thrust: soldier image"
target = "includes/drawFiles.lua"
pattern = '_G\[soldier\.tag\.\."_"\.\.soldier\.state\]'
position = "at"
payload = 'rkkaFrame(soldier)'
times = 7


# ============================== MELEE SKILL FIX ==============================
# A vanilla bug in cqc(). In melee a German is meant to fight with skill 30 + 15 per
# difficulty level. The game writes that number into his real skill, after it has already
# copied the old skill for the fight. So his first melee used his shooting skill, and his
# shooting skill was replaced for the rest of the map.
# Fixed here: the melee number is used for the fight and his own skill is left alone.
# Delete this patch to get the vanilla behaviour back.
[[patches]]
[patches.pattern]
id = "rkka:cqc_skill_fix"
name = "Melee: Germans use their melee skill, shooting skill untouched"
target = "includes/urb_engine.lua"
pattern = """
if(attacker.faction == "axis") then
attacker.skill = 30 + (player.diff * 15)
end
if(defender.faction == "axis") then
defender.skill = 30 + (player.diff * 15)
end
--
if(attacker.spec == "commando") then
aSkill = attacker.skill + 10
end
"""
position = "at"
match_indent = true
times = 1
payload = """
if(attacker.faction == "axis") then
  aSkill = 30 + (player.diff * 15)
end
if(defender.faction == "axis") then
  dSkill = 30 + (player.diff * 15)
end
--
if(attacker.spec == "commando") then
  aSkill = aSkill + 10
end
"""
