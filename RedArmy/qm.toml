# qm.toml: changes to game code, for things faction.toml can't do.
# Holds: the intro screen text, the Strelok grenade, primary AT rifles, suppressed weapons,
#        the bayonet thrust, a melee skill fix.
# Guide: QuarterMaster modding wiki, Part 4.

[manifest]
version = "1.0.0"

# PLACEHOLDER example patch: prints one line to the log when the game starts.
# Remove the "# " to turn it on.
# [[patches]]
# [patches.pattern]
# id = "rkka:hello"
# target = "main.lua"
# pattern = 'require "includes/directives"'
# position = "after"
# payload = '''
# print("[Eastern Front] loaded")
# '''

[[patches]]
[patches.pattern]
id = "rkka:hello"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.print("URB and the MNB community presents", 500, 490)'
position = "after"
payload = '''love.graphics.setColor( love.math.colorFromBytes(190, 190, 190, textFade))
love.graphics.print("Red Army Mod loaded!", 500, 525)
'''
[[patches]] 
[patches.pattern]
id = "rkka:introDate"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "June 6, 1944"}, 0, 250, 1280, "center")'
position = "at"
payload = '''love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "October 10, 1943"}, 0, 250, 1280, "center")
'''
[[patches]] 
[patches.pattern]
id = "rkka:IntroOrBat"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "Company C, 116th Regiment, 29th div"}, 0, 400, 1280, "center")'
position = "at"
payload = '''
love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "Razvedvzvod, 117th Guards Rifle Regiment, 39th Guards Rifle Division, 8th Guards Army, 3rd Ukrainian Front"}, 0, 400, 1280, "center")
'''

# ============================== STRELOK SKILL 1: GRENADE ==============================
# The Strelok's first skill (vanilla: AP rounds) becomes a grenade throw.
# It reuses the Avtomatchik's grenade (his skill 2). TODO: its own explosive.

# 1. The click: open the "where to throw" prompt. Replaces the whole AP rounds block, so
#    its buff sound and voice line no longer play, and the cooldown no longer starts here.
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_copy"
name = "Strelok skill 1: grenade prompt"
target = "includes/urb_engine.lua"
pattern = """
buffer(player.deployedTroops[convertedId(specID)], "AP rounds")
-- play a lil buff sound
local buff_sfx2
--load the proper sound for the gun
buff_sfx2 = buffSound:clone()
buff_sfx2:play()
player.deployedTroops[convertedId(specID)].skill1Timer = 180
--
local clone_sfx4
clone_sfx4 = _G["apTalk"..randNbr(6)]:clone()
clone_sfx4:setVolume(stepScale(player.deployedTroops[convertedId(specID)])/3)
clone_sfx4:setPitch( ((90 + randNbr(10))/100))
clone_sfx4:play()
"""
position = "at"
match_indent = true
times = 1
payload = """
mousePrompt = 2
mousePrompter = specID
mousePromptLock = 1
"""

# 2. The throw: the game puts skill 2 on a 120 sec cooldown (it is the Avtomatchik's skill 2).
#    For the Strelok the grenade is skill 1, so his skill 1 gets the cooldown: 90 sec.
#    Change the 90 here to change the cooldown.
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_time"
name = "Strelok skill 1: grenade cooldown"
target = "includes/urb_engine.lua"
pattern = 'player.deployedTroops[foo].skill2Timer = 120'
position = "at"
match_indent = true
times = 1
payload = """
if(player.deployedTroops[foo].spec == "rifle") then
  player.deployedTroops[foo].skill1Timer = 90
else
  player.deployedTroops[foo].skill2Timer = 120
end
"""


# I need to somehow replace the first skill of the Strelok with the Limonka...
